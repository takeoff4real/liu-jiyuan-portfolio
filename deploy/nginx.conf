server {
    server_name ljy4realportfolio.site www.ljy4realportfolio.site;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    location ^~ /_next/static/ {
        root /var/www/portfolio-site/dist/client;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /assets/web-v1/ {
        root /var/www/portfolio-site/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /fonts/web-v1/ {
        root /var/www/portfolio-site/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        root /var/www/portfolio-site/public;
        try_files $uri =404;
        expires 7d;
    }

    location /fonts/ {
        root /var/www/portfolio-site/public;
        try_files $uri =404;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/ljy4realportfolio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ljy4realportfolio.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = ljy4realportfolio.site) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name ljy4realportfolio.site www.ljy4realportfolio.site;
    return 404;
}
